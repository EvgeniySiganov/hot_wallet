version: '3.8'

services:
  hot-wallet-db:
    image: postgres:15
    container_name: hot-wallet-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hot-wallet
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
